name: Web CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web-ci:
    name: Simulation Web CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: simulation-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simulation-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and rendering tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

