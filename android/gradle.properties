# Gradle properties for Physics Lab Android project.
#
# JDK for Gradle: Set JAVA_HOME to your JDK 17 installation.
# Example: JAVA_HOME=D:/jdk-17
#
# Gradle user home: Set GRADLE_USER_HOME to control where Gradle stores
# its caches and downloaded distributions.
# Example: GRADLE_USER_HOME=D:/Gradle
#
# Android SDK: Set ANDROID_HOME (or ANDROID_SDK_ROOT) to your SDK path.
# Example: ANDROID_HOME=D:/Android/Sdk
#
# These are environment-level settings. Do NOT hardcode machine-specific
# paths in this file.

# AndroidX
android.useAndroidX=true

# Non-transitive R classes for smaller APK
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# JVM memory allocation tuned for development host
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -XX:CICompilerCount=2
kotlin.daemon.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC

# Execution limits to prevent memory exhaustion
org.gradle.parallel=false
org.gradle.workers.max=1

